<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Finanzas personales en dos monedas, con tus datos en tu dispositivo. Gratis para empezar." />
    <!-- Vista previa al compartir el enlace (BRD-13). Imagen: public/og-app.png (1200x630). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MOY IQ" />
    <meta property="og:url" content="https://app.moyiq.app/app/" />
    <meta property="og:title" content="MOY IQ · App de finanzas personales" />
    <meta property="og:description" content="Finanzas personales en dos monedas, con tus datos en tu dispositivo. Gratis para empezar." />
    <meta property="og:image" content="https://app.moyiq.app/app/og-app.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MOY IQ: dial de la marca y el lema de la app sobre fondo azul marino" />
    <meta property="og:locale" content="es_LA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MOY IQ · App de finanzas personales" />
    <meta name="twitter:description" content="Finanzas personales en dos monedas, con tus datos en tu dispositivo. Gratis para empezar." />
    <meta name="twitter:image" content="https://app.moyiq.app/app/og-app.png" />
    <!-- La barra del navegador/PWA sigue al tema: en oscuro debe igualar --bg (#0E1628), no el navy de marca -->
    <meta name="theme-color" content="#14213D" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1628" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MOY IQ" />
    <link rel="icon" type="image/png" href="/app/favicon.png" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <title>MOY IQ</title>
    <!-- Fuentes autohospedadas (RGPD: antes iban a Google Fonts, transmitía
         la IP del visitante a Google). Carga NO bloqueante: preload + swap media=print. -->
    <link rel="preload" as="style" href="/fonts.css" />
    <link href="/fonts.css" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="/fonts.css" rel="stylesheet" /></noscript>
    <!-- Pantalla de carga (C-32): se ve mientras baja el JS y mientras la app
         verifica la sesión; antes era una pantalla en blanco de varios segundos. -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #F1EEE6; color: #14213D; font: 600 15px/1 system-ui, sans-serif; letter-spacing: .02em; }
      .boot-bar { width: 120px; height: 3px; border-radius: 2px; background: rgba(20,33,61,.12); overflow: hidden; }
      .boot-bar::after { content: ""; display: block; width: 40%; height: 100%; background: #B8863B; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-slide { from { transform: translateX(-100%) } to { transform: translateX(250%) } }
      @media (prefers-color-scheme: dark) { .boot { background: #0E1628; color: #F1EEE6; } .boot-bar { background: rgba(241,238,230,.14); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar::after { animation: none; width: 100%; opacity: .5; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="MOY IQ"><span>MOY IQ</span><div class="boot-bar"></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
