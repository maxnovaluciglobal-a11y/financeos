# Configuración MÍNIMA del CLI de Supabase para este repo: solo fija `verify_jwt`
# de cada Edge Function (auditoría 360, C-12 / OPS-3). Antes dependía de
# acordarse de `--no-verify-jwt` en cada deploy: un redeploy sin la bandera
# dejó el nurture de Starter con 401 del 08 al 18-oct-2026 sin que nadie lo notara.
#
# Los valores son los de producción (proyecto nelwgbcddwiaimzbcuas) al 19-oct-2026,
# leídos con `supabase functions list -o json --project-ref nelwgbcddwiaimzbcuas`.
# Cambiar uno es una decisión de seguridad: actualizar también
# supabase/functions/_shared/verifyJwtConfig.test.ts, que verifica este archivo.
#
# ⚠️ NO correr `supabase config push`: este archivo no describe Auth, SMTP, hooks
# ni OAuth de producción y los pisaría con valores por defecto.
# ⚠️ Correr el CLI desde la raíz del repo (o con `--workdir`), siempre con
# `--project-ref nelwgbcddwiaimzbcuas` y nunca con el cwd en `supabase/functions/`
# (ahí crea `supabase/functions/supabase/.temp`).

project_id = "financeos-prod"

# Supabase Auth "Send Email Hook": firma propia (standardwebhooks, SEND_EMAIL_HOOK_SECRET).
[functions.auth-email-hook]
verify_jwt = false

# La llama la app con la sesión; el JWT se verifica adentro contra Auth (C-22, 20-oct-2026).
[functions.delete-account]
verify_jwt = false

# pg_cron diario (header x-cron-secret): aviso de jobs con HTTP ≠ 2xx (C-12, 19-oct-2026).
[functions.cron-health-alert]
verify_jwt = false

# Trigger SQL (pg_net) o cliente anon; autentica con el header x-internal-secret.
[functions.lead-unsubscribe]
verify_jwt = false

[functions.newsletter-sync]
verify_jwt = false

[functions.notify-admin-signup]
verify_jwt = false

# Llamada pública desde la landing; actúa solo sobre una fila ya existente.
[functions.send-cancellation-confirmation]
verify_jwt = false

# pg_cron (header x-cron-secret) y bienvenida pedida desde el navegador.
[functions.send-nurture-diagnostico-email]
verify_jwt = false

[functions.send-nurture-invest-email]
verify_jwt = false

[functions.send-nurture-starter-email]
verify_jwt = false

# Llamada pública desde la app y la landing; actúa solo sobre una fila existente.
[functions.send-optin-confirmation]
verify_jwt = false

# pg_cron la invoca con `Authorization: Bearer <JWT>` y x-cron-secret: ESTA SÍ verifica JWT
# (y desde el 19-oct-2026 además exige x-cron-secret, ver send-push/requestGuard.ts).
[functions.send-push]
verify_jwt = true

# La llama el navegador sin sesión; la autorización real es checkProLicense().
[functions.send-report-email]
verify_jwt = false

# Stripe firma el evento (stripe-signature); no manda JWT.
[functions.stripe-webhook]
verify_jwt = false

# pg_cron cada 5 min desde public.uptime_tick() (header x-cron-secret): C-11, 19-oct-2026.
[functions.uptime-alert]
verify_jwt = false
